# XcodeGen の設定 (make project DEVELOPMENT_TEAM=<チーム ID> で MNISTBench.xcodeproj を作る)
name: MNISTBench
options:
  bundleIdPrefix: jp.jsk.mnist
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ACCELERATE_NEW_LAPACK=1"]
targets:
  MNISTBench:
    type: application
    platform: iOS
    sources:
      - path: MNISTBench/App
      - path: MNISTBench/Shared
        excludes: ["Bridging.h"]
      - path: MNISTBench/Engine
      - path: models/MNISTMLP.mlmodel
      - path: models/MNISTCNN.mlmodel
      - path: models/MNISTMLP_P1.mlpackage
      - path: models/MNISTMLP_P100.mlpackage
      - path: models/MNISTCNN_P1.mlpackage
      - path: models/MNISTCNN_P100.mlpackage
      - path: ../phone/site/mnist_test.gz.txt
        buildPhase: resources
      - path: ../phone/site/mnist_train6k.gz.txt
        buildPhase: resources
      - path: ../phone/site/mlp_w.gz.txt
        buildPhase: resources
      - path: ../phone/site/cnn_w.gz.txt
        buildPhase: resources
    dependencies:
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.jsk.mnist.MNISTBench
        SWIFT_OBJC_BRIDGING_HEADER: MNISTBench/Shared/Bridging.h
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MNIST 計測
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        COREML_CODEGEN_LANGUAGE: None
