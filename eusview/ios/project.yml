# XcodeGen の設定:  make -C eusview/ios project DEVELOPMENT_TEAM=<チーム ID>
name: EusView
options:
  bundleIdPrefix: jp.jsk.eusview
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  EusView:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: EusView/App
      - path: EusView/Physics
        excludes: ["Bridging.h"]
      - path: EusView/Assets.xcassets
      - path: ../robots
        type: folder
        buildPhase: resources
    dependencies:
      - framework: third_party/ODE.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.jsk.eusview.EusView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: EusView/Physics/Bridging.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: EusView
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Mac などの EusLisp から関節角を受け取るため
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
